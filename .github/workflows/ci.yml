name: CI

# 계약(docs/09, 13, 19 §0)이 코드와 어긋나면 여기서 막는다.
# 수용 기준은 docs/18_Testing_Strategy.md §1.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run --extra test python -m pytest -q

      - name: Verify migrations round-trip
        # 스키마 정본은 Alembic이다 (docs/13 §0). upgrade/downgrade가 모두 성립해야 한다.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-check.db
          AUTO_CREATE_TABLES: "false"
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          rm -f ci-check.db

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
