[project]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS Phase1 FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "redis>=5.0.0",
  "openai>=1.40.0",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4.0",
  "alembic>=1.13.0",
  "pyjwt[crypto]>=2.9.0",
  "mcp>=1.2.0",
  "jarvis-mcp",
]

[tool.uv.sources]
jarvis-mcp = { path = "../mcp", editable = true }

[project.optional-dependencies]
# 로컬 STT. Bedrock 게이트웨이는 음성을 제공하지 않으므로 온디바이스로 처리한다.
voice = [
  "faster-whisper>=1.1.0",
]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
